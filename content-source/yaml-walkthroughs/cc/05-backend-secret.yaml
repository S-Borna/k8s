# Template — fyll INTE i riktiga värden här.
# Secrets skapas och roteras via kubectl (värdena ska aldrig committas).
#
# Backend-secrets (DB + JWT):
#   kubectl -n <namespace> create secret generic backend-secrets \
#     --from-literal=ConnectionStrings__DefaultConnection="<connection-string>" \
#     --from-literal=Jwt__Key="<32+ tecken random>"
#
# Pull-secret för GitLab Container Registry:
#   kubectl -n <namespace> create secret docker-registry gitlab-registry \
#     --docker-server=registry.git.chas-lab.dev \
#     --docker-username=<user> \
#     --docker-password=<token-med-read_registry>
#
# Deploymenten läser backend-secrets via envFrom och använder gitlab-registry
# som imagePullSecret.

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app: felis
    component: backend
type: Opaque
data:
  ConnectionStrings__DefaultConnection: "<base64-encoded-value>"
  Jwt__Key: "<base64-encoded-value>"
