apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: finance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Hello from catalog"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
spec:
  selector:
    app: catalog
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Hello from payments"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: finance
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jump
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jump
  template:
    metadata:
      labels:
        app: jump
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
        searches:
          - default.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      containers:
        - name: jump
          image: nicolaka/netshoot
          env:
            - name: PAYMENTS_HOST
              value: payments
            - name: PAYMENTS_PORT
              value: "80"
          command:
            - /bin/sh
            - -c
            - |
              cat >/check.sh <<'EOF'
              #!/bin/sh
              set +e

              fails=0

              check() {
                title="$1"
                shift
                echo
                echo "==> $title"
                "$@"
                rc=$?
                if [ $rc -eq 0 ]; then
                  echo "PASS"
                else
                  echo "FAIL"
                  fails=$((fails+1))
                fi
              }

              check "1. Resolve kubernetes service" \
                nslookup kubernetes

              check "2. Resolve local service by short name: catalog" \
                nslookup catalog

              check "3. Reach local service over HTTP: http://catalog" \
                curl -fsS http://catalog

              check "4. Resolve remote service using PAYMENTS_HOST=${PAYMENTS_HOST}" \
                nslookup "${PAYMENTS_HOST}"

              check "5. Reach remote service over HTTP: http://${PAYMENTS_HOST}:${PAYMENTS_PORT}" \
                curl -fsS "http://${PAYMENTS_HOST}:${PAYMENTS_PORT}"

              echo
              if [ $fails -eq 0 ]; then
                echo "LAB COMPLETE"
                exit 0
              else
                echo "$fails checks failed"
                exit 1
              fi
              EOF

              chmod +x /check.sh
              sleep infinity
