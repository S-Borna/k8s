apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-lab-pvc
spec:
  accessModes: 
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
	storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep infinity"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-lab-pvc
